# tool-status manifest
#
# One probe per line, pipe-delimited:
#
#   key | label | kind | probe | version | alt | health | note
#
#   key      stable identifier (used in --json)
#   label    short name shown on the statusline (keep it 3-6 chars)
#   kind     bin | hook | cmdset | path | plugin | mcp
#   probe    bin    -> command name resolved on PATH
#            hook   -> Event:needle, matched against hook commands in settings.json
#            cmdset -> name of a slash-command suite under <profile>/commands/<name>
#            path   -> filesystem path ($HOME and ~ are expanded)
#            plugin -> plugin id as it appears in enabledPlugins
#            mcp    -> server name in .claude.json mcpServers
#   version  optional command whose output carries a version string, or
#            @file:<path> to read one from a VERSION file ({profile} expands)
#   alt      optional fallback path: if the primary probe fails but this exists,
#            the tool reports warn instead of missing
#   health   optional command that must exit 0. Found but unhealthy is warn, not
#            ok — being on PATH is not the same as being usable.
#   note     one-line description, shown by --full
#
# States: ok (green) / warn (yellow, inconsistent) / missing (red).
# A hook that is wired but whose script is gone reports warn, not ok — that
# inconsistency is the whole reason this tool exists.

captains-log|log|hook|Stop:log-session.sh||||Narrative session journal (Picard)
devdiary|diary|hook|Stop:dev-diary.sh||||Factual session journal
rtk|rtk|bin|rtk|rtk --version|||Token-optimizing CLI proxy
gh|gh|bin|gh|gh --version||gh auth status --active|GitHub CLI: PRs, issues, releases
gsd|gsd|cmdset|gsd|@file:{profile}/get-shit-done/VERSION|||Get Shit Done framework (/gsd:* commands)
claude-mem|mem|plugin|claude-mem@thedotmack||||Cross-session memory
